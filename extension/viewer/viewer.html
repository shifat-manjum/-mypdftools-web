<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Preview — MyPdfTools Capture</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="studio-layout">
    <!-- Top Navigation & Toolbar -->
    <header class="studio-header">
      <div class="header-left">
        <a href="https://www.mypdftools.it" target="_blank" rel="noopener noreferrer" class="brand-link">
          <div class="brand-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>
          <div class="brand-titles">
            <h2>MyPdfTools Capture</h2>
            <span id="page-title-label" class="page-title-label">Rendering preview...</span>
          </div>
        </a>
      </div>

      <!-- Preview Mode & Zoom Controls -->
      <div class="header-center">
        <div class="control-pill">
          <button id="btn-fit-width" class="text-btn active" title="Fit to Screen Preview">📄 Fit Preview</button>
          <button id="btn-zoom-100" class="text-btn" title="View 100% Actual Size">🔍 100% Zoom</button>
          <span id="dimension-badge" class="dimension-badge">...</span>
        </div>

        <div class="tool-pill">
          <button id="btn-tool-blur" class="tool-btn" title="Redact / Blur Sensitive Info">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span>Blur Tool</span>
          </button>
        </div>
      </div>

      <!-- Export Actions -->
      <div class="header-right">
        <button id="btn-download-png" class="btn btn-secondary" title="Download High-Res PNG Image">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>Download Image (PNG)</span>
        </button>

        <button id="btn-download-pdf" class="btn btn-primary" title="Export as PDF Document">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>Export as PDF</span>
        </button>

        <a href="https://www.mypdftools.it" target="_blank" rel="noopener noreferrer" class="btn btn-emerald" title="Open MyPdfTools Suite">
          <span>⚡ MyPdfTools</span>
        </a>
      </div>
    </header>

    <!-- Full-Page Document Preview Workspace -->
    <main class="studio-workspace" id="studio-workspace">
      <div id="loading-spinner" class="loading-state">
        <div class="large-spinner"></div>
        <p>Stitching full webpage preview...</p>
      </div>

      <!-- Document Preview Stage (GoFullPage style document container) -->
      <div id="preview-stage" class="preview-stage hidden">
        <div class="preview-card" id="preview-card">
          <!-- Live Preview Image -->
          <img id="preview-image" alt="Full Page Preview" class="preview-image fit-mode" />
          <div id="blur-overlay" class="blur-overlay hidden"></div>
        </div>
      </div>

      <!-- Hidden Offscreen Canvas for High-Res Stitching -->
      <canvas id="hidden-canvas" style="display: none;"></canvas>
    </main>

    <!-- Bottom Companion Bar -->
    <footer class="ad-companion-bar">
      <div class="companion-content">
        <div class="companion-text">
          <strong>💡 Want to compress or sign this screenshot?</strong>
          <span>Use 100% free, private PDF tools at MyPdfTools. Zero server uploads.</span>
        </div>
        <div class="companion-actions">
          <a href="https://www.mypdftools.it/#/it/comprimi-pdf" target="_blank" rel="noopener noreferrer" class="banner-btn">Comprimi PDF</a>
          <a href="https://www.mypdftools.it/#/it/firma-pdf" target="_blank" rel="noopener noreferrer" class="banner-btn">Firma PDF</a>
          <a href="https://www.mypdftools.it" target="_blank" rel="noopener noreferrer" class="banner-btn primary">Explore All Tools →</a>
        </div>
      </div>
    </footer>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
