<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPdfTools Capture Studio</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="studio-layout">
    <!-- Top Navigation & Toolbar -->
    <header class="studio-header">
      <div class="header-left">
        <a href="https://www.mypdftools.it" target="_blank" rel="noopener noreferrer" class="brand-link">
          <div class="brand-logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </div>
          <div class="brand-titles">
            <h2>MyPdfTools Capture</h2>
            <span id="page-title-label" class="page-title-label">Loading capture...</span>
          </div>
        </a>
      </div>

      <!-- Zoom & Viewport Controls -->
      <div class="header-center">
        <div class="control-pill">
          <button id="btn-zoom-out" class="icon-btn" title="Zoom Out (Ctrl -)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          </button>
          <span id="zoom-level" class="zoom-text">Fit</span>
          <button id="btn-zoom-in" class="icon-btn" title="Zoom In (Ctrl +)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          </button>
          <button id="btn-zoom-fit" class="text-btn" title="Fit to Width">Fit Width</button>
          <button id="btn-zoom-100" class="text-btn" title="Original 100%">100%</button>
        </div>

        <div class="tool-pill">
          <button id="btn-tool-blur" class="tool-btn" title="Redact / Blur Sensitive Info">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <span>Blur Tool</span>
          </button>
          <button id="btn-tool-crop" class="tool-btn" title="Crop Image">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"></path><path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"></path></svg>
            <span>Crop</span>
          </button>
        </div>
      </div>

      <!-- Export Actions -->
      <div class="header-right">
        <button id="btn-download-png" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span>Download PNG</span>
        </button>

        <button id="btn-download-pdf" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>Export as PDF</span>
        </button>

        <div class="mypdftools-dropdown-wrap">
          <a href="https://www.mypdftools.it" target="_blank" rel="noopener noreferrer" class="btn btn-emerald" title="Open MyPdfTools Suite">
            <span>⚡ MyPdfTools</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Canvas Workspace -->
    <main class="studio-workspace">
      <div id="loading-spinner" class="loading-state">
        <div class="large-spinner"></div>
        <p>Stitching screenshot slices...</p>
      </div>

      <div id="canvas-wrapper" class="canvas-wrapper">
        <canvas id="output-canvas"></canvas>
        <div id="selection-overlay" class="selection-overlay hidden"></div>
      </div>
    </main>

    <!-- Bottom Action Bar / Monetization Banner -->
    <aside class="ad-companion-bar">
      <div class="companion-content">
        <div class="companion-text">
          <strong>Need to compress or sign this document?</strong>
          <span>Use 100% free, private PDF tools at MyPdfTools. Zero server uploads.</span>
        </div>
        <div class="companion-actions">
          <a href="https://www.mypdftools.it/#/it/comprimi-pdf" target="_blank" rel="noopener noreferrer" class="banner-btn">Comprimi PDF</a>
          <a href="https://www.mypdftools.it/#/it/firma-pdf" target="_blank" rel="noopener noreferrer" class="banner-btn">Firma PDF</a>
          <a href="https://www.mypdftools.it" target="_blank" rel="noopener noreferrer" class="banner-btn primary">Explore All Tools →</a>
        </div>
      </div>
    </aside>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
